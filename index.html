<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishwar Ka Portfolio</title>
    <style>
        body {
            background-color: #0f172a; /* Ultra dark slate background */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        h1 {
            color: #38bdf8; /* Sky blue title color */
            font-size: 2.8rem;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 30px auto;
            line-height: 1.6;
        }
        .skills-box {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            margin: 0 auto 30px auto;
            border: 1px solid #334155;
        }
        .skills-box h3 {
            color: #38bdf8;
            margin-top: 0;
        }
        .tag {
            background-color: #0f172a;
            color: #38bdf8;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: inline-block;
            margin: 5px;
            border: 1px solid #38bdf8;
        }
        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #0ea5e9;
            transform: scale(1.05); /* Button thoda bada hoga mouse lane par */
        }
    </style>
</head>
<body>
    <h1>Hello World! I am a Ishwar .</h1>
    <p>I am a passionate Web Developer, currently mastering HTML, CSS, and modern web experiences.</p>
    <!-- Naya Skills Section -->
    <div class="skills-box">
        <h3>My Skills 🧠</h3>
        <span class="tag">HTML5</span>
        <span class="tag">CSS3</span>
        <span class="tag">GitHub</span>
        <span class="tag">AI Tools</span>
    </div>
    <a href="https://github.com" target="_blank" class="btn">View my Github profile</a>
</body>
</html>
