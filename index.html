<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Pehla Project</title>
    <style>
        /* Yaha se aapki website ka style badlega */
        body {
            background-color: #1a1a2e; /* Dark theme background */
            color: #ffffff; /* White text color */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center; /* Sab kuch center me lane ke liye */
            padding-top: 50px;
        }
        h1 {
            color: #00ffd2; /* Title ka mast glow color */
            font-size: 2.5rem;
        }
        p {
            color: #b0b0b0;
            font-size: 1.2rem;
        }
        .btn {
            background-color: #00ffd2;
            color: #1a1a2e;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        .btn:hover {
            background-color: #00c8a5; /* Button par mouse lane se color change hoga */
        }
    </style>
</head>
<body>
    <h1>Hello World! Mera naam Ishwar hai.</h1>
    <p>Main HTML, CSS aur Web Development seekh raha hoon.</p>
    <a href="https://github.com" target="_blank" class="btn">Mera GitHub Profile Dekho</a>
